<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>UNOP TI Hub</title>
    <script type="text/javascript">
      // Truco "Single Page Apps for GitHub Pages" (rafgraph/spa-github-pages):
      // GitHub Pages no sabe de rutas de react-router, asi que cualquier
      // subruta cae aqui (404.html). Codificamos la ruta real en el query
      // string y redirigimos a index.html, que la restaura antes de montar
      // la app (ver el script en index.html).
      var pathSegmentsToKeep = 1 // "/INVENTARIO-DEFINITIVO"

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
